name: meme coin scanner
on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scanner.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RUN_ONCE: "1"
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add scanner_seen.json && git commit -m "update seen" || true
          git push || true
